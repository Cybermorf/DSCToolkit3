name: Tagged release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/DSC.Toolkit.Tests/DSC.Toolkit.Tests.csproj -c Release
      - run: dotnet publish src/DSC.Toolkit/DSC.Toolkit.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -o artifacts/${{ matrix.runtime }}
      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path "artifacts/${{ matrix.runtime }}/*" -DestinationPath "DSC-Toolkit-${{ matrix.runtime }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: DSC-Toolkit-${{ matrix.runtime }}.zip
  publish-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
